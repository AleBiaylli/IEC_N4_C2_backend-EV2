      [
        {
          "id": 5442,
          "name": "string",
          "teacher": 1506,
          "teacher_detail": {
            "first_name": "string",
            "id": 5352,
            "last_name": "string"
          }
        },
        {
          "id": 392,
          "name": "string",
          "teacher": 107,
          "teacher_detail": {
            "first_name": "string",
            "id": 284,
            "last_name": "string"
          }
        }
      ]
order: 1000
