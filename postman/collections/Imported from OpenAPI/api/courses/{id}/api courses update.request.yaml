$kind: http-request
url: "{{baseUrl}}/api/courses/:id/"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "2035"
    description: A unique integer value identifying this course.
body:
  type: json
  content: |-
    {
      "name": "string",
      "teacher": 831,
      "teacher_detail": {
        "first_name": "string",
        "last_name": "string",
        "id": "string"
      },
      "id": true
    }
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api courses update.resources/examples
order: 2000
