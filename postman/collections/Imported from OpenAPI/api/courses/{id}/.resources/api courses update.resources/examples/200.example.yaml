$kind: http-example
request:
  url: "{{baseUrl}}/api/courses/:id/"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: "2035"
      description: A unique integer value identifying this course.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "teacher": 831,
        "teacher_detail": {
          "first_name": "string",
          "last_name": "string",
          "id": "string"
        },
        "id": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 6286,
        "name": "string",
        "teacher": 7365,
        "teacher_detail": {
          "first_name": "string",
          "id": 3997,
          "last_name": "string"
        }
      }
order: 1000
