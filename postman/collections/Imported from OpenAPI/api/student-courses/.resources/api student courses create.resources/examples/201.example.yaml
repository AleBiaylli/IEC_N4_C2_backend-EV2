$kind: http-example
request:
  url: "{{baseUrl}}/api/student-courses/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "course": 5042,
        "student": 4691,
        "id": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course": 3292,
        "id": 642,
        "student": 1663
      }
order: 1000
