$kind: http-request
url: "{{baseUrl}}/api/students/:id/"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "2035"
    description: A unique integer value identifying this student.
body:
  type: json
  content: |-
    {
      "first_name": "string",
      "last_name": "string",
      "id": 5132
    }
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api students update.resources/examples
order: 2000
