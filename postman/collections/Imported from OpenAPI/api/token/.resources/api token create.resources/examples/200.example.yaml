$kind: http-example
request:
  url: "{{baseUrl}}/api/token/"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "password": "string",
        "username": "string",
        "access": 1269,
        "refresh": 5404
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access": "string",
        "refresh": "string",
        "password": "string",
        "username": "string"
      }
order: 1000
