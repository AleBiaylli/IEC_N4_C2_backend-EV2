$kind: http-example
request:
  url: "{{baseUrl}}/api/student-courses/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "course": 9023,
          "id": 3094,
          "student": 4317
        },
        {
          "course": 4035,
          "id": 6637,
          "student": 8438
        }
      ]
order: 1000
