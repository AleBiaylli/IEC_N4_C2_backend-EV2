$kind: http-example
request:
  url: "{{baseUrl}}/api/student-courses/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "course": 7921,
        "student": 6980,
        "id": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "course": 5521,
        "id": 3083,
        "student": 1483
      }
order: 1000
