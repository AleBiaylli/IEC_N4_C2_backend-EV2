$kind: http-example
request:
  url: "{{baseUrl}}/api/students/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "first_name": "string",
        "last_name": "string",
        "id": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "first_name": "string",
        "id": 8753,
        "last_name": "string"
      }
order: 1000
