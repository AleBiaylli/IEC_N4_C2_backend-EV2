$kind: http-request
url: "{{baseUrl}}/api/courses/:id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "9390"
    description: A unique integer value identifying this course.
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api courses retrieve.resources/examples
order: 1000
