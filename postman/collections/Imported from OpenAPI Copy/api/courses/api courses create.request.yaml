$kind: http-request
url: "{{baseUrl}}/api/courses/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "teacher": 5757,
      "teacher_detail": {
        "first_name": "string",
        "last_name": "string",
        "id": 5565
      },
      "id": false
    }
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api courses create.resources/examples
order: 3000
