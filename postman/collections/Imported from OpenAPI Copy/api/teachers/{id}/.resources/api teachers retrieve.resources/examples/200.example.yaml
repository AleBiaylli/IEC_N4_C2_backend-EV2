$kind: http-example
request:
  url: "{{baseUrl}}/api/teachers/:id/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: "9390"
      description: A unique integer value identifying this teacher.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "first_name": "string",
        "id": 8753,
        "last_name": "string"
      }
order: 1000
