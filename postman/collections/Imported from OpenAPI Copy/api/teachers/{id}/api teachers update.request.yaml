$kind: http-request
url: "{{baseUrl}}/api/teachers/:id/"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "9390"
    description: A unique integer value identifying this teacher.
body:
  type: json
  content: |-
    {
      "first_name": "string",
      "last_name": "string",
      "id": "string"
    }
auth:
  type: apikey
  credentials:
    key: sessionid
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/api teachers update.resources/examples
order: 2000
