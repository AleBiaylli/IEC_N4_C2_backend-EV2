{% extends 'base.html' %}

{% block title %}Estudiantes - Sistema Académico{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Estudiantes</h2>
    <button class="btn btn-dark" onclick="openStudentModal()">+ Agregar Estudiante</button>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre Completo</th>
                <th>Email</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody id="students-table-body">
            <tr>
                <td colspan="4" class="text-center">Cargando estudiantes...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal Crear/Editar Estudiante -->
<div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="studentModalTitle">Nuevo Estudiante</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="student-firstname" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="student-lastname" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="student-email" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Guardar Estudiante</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let studentModalBS;

document.addEventListener('DOMContentLoaded', function() {
    if (!localStorage.getItem('access_token')) {
        window.location.href = "{% url 'login' %}";
        return;
    }

    studentModalBS = new bootstrap.Modal(document.getElementById('studentModal'));
    loadStudents();
    document.getElementById('student-form').addEventListener('submit', handleStudentForm);
});

function loadStudents() {
    fetch('/api/students/', { method: 'GET', headers: getAuthHeaders() })
    .then(res => {
        if (res.status === 401 || res.status === 403) {
            window.location.href = "{% url 'login' %}";
            throw new Error('No autorizado');
        }
        return res.json();
    })
    .then(data => {
        const tbody = document.getElementById('students-table-body');
        tbody.innerHTML = '';
        const students = Array.isArray(data) ? data : (data.results || []);

        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay estudiantes registrados.</td></tr>';
            return;
        }

        students.forEach(s => {
            const safeS = JSON.stringify(s).replace(/"/g, '&quot;');
            tbody.innerHTML += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.first_name || s.name || ''} ${s.last_name || ''}</td>
                    <td>${s.email || 'N/A'}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="editStudent(${safeS})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.id})">Eliminar</button>
                    </td>
                </tr>
            `;
        });
    });
}

function openStudentModal() {
    document.getElementById('student-form').reset();
    document.getElementById('student-id').value = '';
    document.getElementById('studentModalTitle').innerText = 'Nuevo Estudiante';
    studentModalBS.show();
}

function editStudent(s) {
    document.getElementById('student-id').value = s.id;
    document.getElementById('student-firstname').value = s.first_name || s.name || '';
    document.getElementById('student-lastname').value = s.last_name || '';
    document.getElementById('student-email').value = s.email || '';
    document.getElementById('studentModalTitle').innerText = 'Editar Estudiante ID: ' + s.id;
    studentModalBS.show();
}

async function handleStudentForm(e) {
    e.preventDefault();
    const id = document.getElementById('student-id').value;
    const payload = {
        first_name: document.getElementById('student-firstname').value,
        last_name: document.getElementById('student-lastname').value,
        email: document.getElementById('student-email').value
    };

    const url = id ? `/api/students/${id}/` : '/api/students/';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
        method: method,
        headers: getAuthHeaders(),
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        studentModalBS.hide();
        loadStudents();
    } else {
        alert('Error al registrar/actualizar estudiante.');
    }
}

async function deleteStudent(id) {
    if (!confirm('¿Eliminar estudiante?')) return;
    const res = await fetch(`/api/students/${id}/`, {
        method: 'DELETE',
        headers: getAuthHeaders()
    });
    if (res.ok) loadStudents();
    else alert('Error al eliminar.');
}
</script>
{% endblock %}
