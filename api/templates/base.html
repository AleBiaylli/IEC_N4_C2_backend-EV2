<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión Académica{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Barra de Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Sistema Académico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'teachers-list-html' %}">Profesores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'courses-list-html' %}">Cursos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'students-list-html' %}">Estudiantes</a>
                    </li>
                </ul>
                
                <!-- Área de Autenticación Controlada por JS -->
                <div class="d-flex align-items-center" id="nav-auth-section">
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <!-- OBLIGATORIO: Script Bundle de Bootstrap 5 (incluye Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        checkAuthStatus();
    });

    function checkAuthStatus() {
        const token = localStorage.getItem('access_token');
        const authSection = document.getElementById('nav-auth-section');

        if (token && authSection) {
            authSection.innerHTML = `
                <span class="text-light me-3 small">👤 Sesión Activa</span>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            `;
        } else if (authSection) {
            authSection.innerHTML = `
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
            `;
        }
    }

    function logout() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        window.location.href = "{% url 'login' %}";
    }

    function getAuthHeaders() {
        const token = localStorage.getItem('access_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
            headers['Authorization'] = 'Bearer ' + token;
        }
        return headers;
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
