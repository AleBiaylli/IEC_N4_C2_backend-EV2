<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Buses Interurbanos</title>
    <!-- Framework Bootstrap 5 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #f8f9fa; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        .main-container { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        footer { 
            background-color: #0f172a; 
            color: #94a3b8; 
            padding: 1.5rem 0; 
            margin-top: auto; 
            border-top: 3px solid #0284c7; 
        }
    </style>
</head>
<body>

    <!-- NAVBAR CORPORATIVA -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
                <i class="bi bi-bus-front-fill text-info fs-3"></i>
                <span class="fw-bold">Buses Interurbanos</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a href="{% url 'buscar_pasajes' %}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-search me-1"></i>Buscar Pasajes
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DE ERROR 404 -->
    <div class="container main-container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-info mb-3">
                    <i class="bi bi-exclamation-triangle-fill display-1"></i>
                </div>
                <h1 class="display-1 fw-bold text-dark mb-0">404</h1>
                <h3 class="mb-3 text-secondary">¡Dirección no encontrada!</h3>
                <p class="text-muted mb-4">
                    La dirección que ingresaste no existe, ha sido movida o la URL está mal escrita.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{% url 'home' %}" class="btn btn-info text-white fw-bold btn-lg px-4 gap-3 shadow-sm">
                        <i class="bi bi-house-door-fill me-1"></i>Volver al Inicio
                    </a>
                    <a href="{% url 'buscar_pasajes' %}" class="btn btn-outline-secondary btn-lg px-4 gap-3">
                        <i class="bi bi-search me-1"></i>Ver Pasajes
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-1 text-white"><strong>Desarrollado por:</strong> {{ student_name }}</p>
            <p class="mb-0 small">
                <span class="badge bg-secondary me-2">{{ student_section }}</span>
                <span class="badge bg-dark">Año {{ student_year }}</span>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
