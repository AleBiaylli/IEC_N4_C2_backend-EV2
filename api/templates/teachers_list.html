{% extends 'base.html' %}

{% block title %}Profesores - Sistema Académico{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Profesores</h2>
    <button id="btn-add-teacher" class="btn btn-primary d-none" onclick="openTeacherModal()">
        + Agregar Profesor
    </button>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre Completo</th>
                <th>Especialidad</th>
                <th>Email</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody id="teachers-table-body">
            <tr>
                <td colspan="5" class="text-center">Cargando profesores...</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Modal Crear/Editar Profesor -->
<div class="modal fade" id="teacherModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="teacherModalTitle">Nuevo Profesor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="teacher-form">
                    <input type="hidden" id="teacher-id">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="teacher-firstname" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="teacher-lastname" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Especialidad</label>
                        <input type="text" class="form-control" id="teacher-specialty">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="teacher-email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Profesor</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let teacherModalBS = null;

document.addEventListener('DOMContentLoaded', function() {
    try {
        const modalElem = document.getElementById('teacherModal');
        if (modalElem && typeof bootstrap !== 'undefined') {
            teacherModalBS = new bootstrap.Modal(modalElem);
        }
    } catch (e) {
        console.warn("Error modal Bootstrap:", e);
    }
    
    if (localStorage.getItem('access_token')) {
        const btnAdd = document.getElementById('btn-add-teacher');
        if (btnAdd) btnAdd.classList.remove('d-none');
    }
    
    loadTeachers();

    const formElem = document.getElementById('teacher-form');
    if (formElem) {
        formElem.addEventListener('submit', handleTeacherForm);
    }
});

function loadTeachers() {
    fetch('/api/teachers/', { method: 'GET', headers: getAuthHeaders() })
    .then(res => {
        if (!res.ok) throw new Error(`Status ${res.status}`);
        return res.json();
    })
    .then(data => {
        const tbody = document.getElementById('teachers-table-body');
        tbody.innerHTML = '';
        
        const teachers = Array.isArray(data) ? data : (data.results || []);

        if (teachers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">No hay profesores registrados.</td></tr>';
            return;
        }

        const isAuthenticated = !!localStorage.getItem('access_token');

        teachers.forEach(t => {
            const nombre = t.first_name || t.nombre || t.name || '';
            const apellido = t.last_name || t.apellido || '';
            const nombreCompleto = (nombre + ' ' + apellido).trim() || 'Sin Nombre';
            const especialidad = t.specialty || t.especialidad || 'General';
            const email = t.email || 'N/A';

            const safeT = JSON.stringify(t).replace(/"/g, '&quot;');

            const actions = isAuthenticated ? `
                <button class="btn btn-sm btn-outline-warning me-1" onclick="editTeacher(${safeT})">Editar</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteTeacher(${t.id})">Eliminar</button>
            ` : '<span class="text-muted small">Solo lectura</span>';

            tbody.innerHTML += `
                <tr>
                    <td>${t.id}</td>
                    <td><strong>${nombreCompleto}</strong></td>
                    <td><span class="badge bg-info text-dark">${especialidad}</span></td>
                    <td>${email}</td>
                    <td class="text-center">${actions}</td>
                </tr>
            `;
        });
    })
    .catch(err => {
        console.error("Error al cargar profesores:", err);
        document.getElementById('teachers-table-body').innerHTML = 
            `<tr><td colspan="5" class="text-center text-danger">Error al cargar datos (${err.message}). Por favor reintenta.</td></tr>`;
    });
}

function openTeacherModal() {
    document.getElementById('teacher-form').reset();
    document.getElementById('teacher-id').value = '';
    document.getElementById('teacherModalTitle').innerText = 'Nuevo Profesor';
    if (teacherModalBS) teacherModalBS.show();
}

function editTeacher(t) {
    document.getElementById('teacher-id').value = t.id;
    
    // Carga los valores según el nombre de atributo que use tu modelo
    document.getElementById('teacher-firstname').value = t.first_name || t.nombre || t.name || '';
    document.getElementById('teacher-lastname').value = t.last_name || t.apellido || '';
    document.getElementById('teacher-specialty').value = t.specialty || t.especialidad || '';
    document.getElementById('teacher-email').value = t.email || '';
    
    document.getElementById('teacherModalTitle').innerText = 'Editar Profesor ID: ' + t.id;
    if (teacherModalBS) teacherModalBS.show();
}

async function handleTeacherForm(e) {
    e.preventDefault();
    const id = document.getElementById('teacher-id').value;
    
    const valNombre = document.getElementById('teacher-firstname').value;
    const valApellido = document.getElementById('teacher-lastname').value;
    const valEspecialidad = document.getElementById('teacher-specialty').value;
    const valEmail = document.getElementById('teacher-email').value;

    // Enviamos los campos con las claves EXACTAS del modelo en español
    const payload = {
        nombre: valNombre,
        apellido: valApellido,
        especialidad: valEspecialidad,
        email: valEmail
    };

    const token = localStorage.getItem('access_token');
    const headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
    };

    const url = id ? `/api/teachers/${id}/` : '/api/teachers/';
    const method = id ? 'PUT' : 'POST';

    try {
        const res = await fetch(url, {
            method: method,
            headers: headers,
            body: JSON.stringify(payload)
        });

        const resData = await res.json();

        if (res.ok) {
            if (teacherModalBS) teacherModalBS.hide();
            document.getElementById('teacher-form').reset();
            document.getElementById('teacher-id').value = '';

            // Refresca la tabla
            loadTeachers();
        } else {
            console.error("Error devuelto por DRF:", resData);
            alert("Error al guardar: " + JSON.stringify(resData));
        }
    } catch (error) {
        console.error("Error en la petición:", error);
    }
}
</script>
{% endblock %}
