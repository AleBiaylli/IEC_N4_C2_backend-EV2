<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Académico</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .card-header-custom {
            background: #ffffff;
            border-top-left-radius: 15px !important;
            border-top-right-radius: 15px !important;
            border-bottom: none;
            padding-top: 2rem;
        }
        .btn-custom {
            background: #2a5298;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
        }
        .btn-custom:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>

<div class="card card-login p-3">
    <div class="card-header card-header-custom text-center">
        <h3 class="fw-bold text-dark">Sistema Académico</h3>
        <p class="text-muted small">Ingresa tus credenciales para acceder</p>
    </div>
    <div class="card-body">
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

        <!-- IMPORTANTÍSIMO: El tag <form> NO debe llevar atributos 'action' ni 'method' -->
        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Usuario</label>
                <input type="text" class="form-control" id="username" placeholder="Tu usuario" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-custom w-100 mb-2">Ingresar</button>
        </form>
    </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    // 1. Detiene la redirección automática / POST nativo del navegador
    e.preventDefault(); 
    
    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;
    const errorAlert = document.getElementById('error-alert');

    errorAlert.classList.add('d-none');

    try {
        // 2. Envía la solicitud asíncrona a la API de JWT
        const response = await fetch('/api/token/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: usernameInput,
                password: passwordInput
            })
        });

        const data = await response.json();

        if (response.ok) {
            // 3. Guarda los tokens JWT de autenticación en localStorage
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);

            // 4. Redirecciona al panel principal (home)
            window.location.href = '/'; 
        } else {
            errorAlert.textContent = data.detail || 'Usuario o contraseña incorrectos.';
            errorAlert.classList.remove('d-none');
        }
    } catch (error) {
        errorAlert.textContent = 'Error al conectar con el servidor.';
        errorAlert.classList.remove('d-none');
    }
});
</script>

</body>
</html>
